<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive Tic-Tac-Toe Game">
    <title>Tic-Tac-Toe Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <h1>Tic-Tac-Toe</h1>
            <p>Classic X and O Game</p>
        </header>

        <!-- Scoreboard -->
        <section class="scoreboard">

            <div class="score-card player-x">
                <span class="player-symbol">X</span>
                <span class="player-name">Player X</span>
                <span id="scoreX">0</span>
            </div>

            <div class="score-card draws">
                <span class="player-symbol">🤝</span>
                <span class="player-name">Draws</span>
                <span id="scoreDraw">0</span>
            </div>

            <div class="score-card player-o">
                <span class="player-symbol">O</span>
                <span class="player-name">Player O</span>
                <span id="scoreO">0</span>
            </div>

        </section>

        <!-- Game Status -->
        <div class="status-area">
            <p id="status">Player X's Turn</p>
        </div>

        <!-- Game Board -->
        <section class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </section>

        <!-- Buttons -->
        <div class="buttons">

            <button id="newGameBtn" class="new-game-btn">
                🔄 New Game
            </button>

            <button id="resetScoreBtn" class="reset-btn">
                Reset Score
            </button>

        </div>

        <footer>
            <p>Play with your ❤️ once.</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
